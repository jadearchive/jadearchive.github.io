<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template</title>
  <style>
    body{
      background:#f8f5f0;
      font-family:"PingFang SC",serif;
      color:#333;
      margin:0;
    }
    .container{
      width:80%;
      max-width:800px;
      margin:auto;
      padding:60px 0;
    }
    .number{
      color:#999;
      font-size:14px;
      letter-spacing:3px;
    }
    .title{
      font-size:42px;
      margin-top:10px;
    }
    .info{
      color:#888;
      margin-bottom:40px;
    }
    .story{
      font-size:18px;
      line-height:2.2;
      margin:40px 0;
    }
    .photo{
      width:100%;
      border-radius:12px;
      margin:40px 0;
    }
    .end{
      color:#777;
      text-align:center;
      margin-top:80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!--========================-->
    <!-- 编号（修改这里）-->
    <div class="number">
      No.040
    </div>
    <!--========================-->
    <!-- 标题（修改这里）-->
    <div class="title">
      台北101|信义区
    </div>
    <!--========================-->
    <!-- 时间 / 地点（修改这里）-->
    <div class="info">
      
    </div>
    <!--========================-->
    <!-- 第一段正文（修改这里）-->
    <div class="story">
      你对台北的印象里一定会有它吧，台北101.
    </div>
    <!--========================-->
    <!-- 第一张图片（修改这里）-->
    <img class="photo" src="../images/040-1.jpg">
    <!--========================-->
    <!-- 第二段正文（修改这里）-->
    <div class="story">
      夜晚的101是冷冷的银色，分不清是月光的映射还是程又青办公室的内透。
      
      <p>像银河，那粼粼的波光，暖活了你了吗？
      
    </div>
    <!--========================-->
    <!-- 第二张图片（修改这里）-->
    <img class="photo" src="../images/040-2.jpg">
    <!--========================-->
    <!-- 第三段正文（修改这里）-->
    <div class="story">
      好吧，很多东西是只可远观不可近看的，外面的煽动我不感兴趣也嗤之以鼻，拙劣的政治家。
    </div>
    <!--========================-->
    <!-- 第三张图片（需要就复制，不需要就删）-->
    <img class="photo" src="../images/040-3.jpg">
    <!--========================-->
    <!-- 第四段正文（需要就复制，不需要就删）-->
    <div class="story">

    </div>
    <!--========================-->
    <!-- 结尾（修改这里）-->
    <div class="end">
   
    </div>
  </div>
</body>
</html>
