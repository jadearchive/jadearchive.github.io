<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template</title>
  <style>
    body{
      background:#f8f5f0;
      font-family:"PingFang SC",serif;
      color:#333;
      margin:0;
    }
    .container{
      width:80%;
      max-width:800px;
      margin:auto;
      padding:60px 0;
    }
    .number{
      color:#999;
      font-size:14px;
      letter-spacing:3px;
    }
    .title{
      font-size:42px;
      margin-top:10px;
    }
    .info{
      color:#888;
      margin-bottom:40px;
    }
    .story{
      font-size:18px;
      line-height:2.2;
      margin:40px 0;
    }
    .photo{
      width:100%;
      border-radius:12px;
      margin:40px 0;
    }
    .end{
      color:#777;
      text-align:center;
      margin-top:80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!--========================-->
    <!-- 编号（修改这里）-->

    </div>

    <!--========================-->
    <!-- 第一段正文（修改这里）-->

卡皮巴拉，在雨天情绪稳定地，无所畏惧，甚至根本不算个事儿的，大步向前走。
    </div>
    <!--========================-->
    <!-- 第一张图片（修改这里）-->

    <!--========================-->
    <!-- 第二张图片（修改这里）-->

</html>
