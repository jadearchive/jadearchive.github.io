<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template</title>
  <style>
    body{
      background:#f8f5f0;
      font-family:"PingFang SC",serif;
      color:#333;
      margin:0;
    }
    .container{
      width:80%;
      max-width:800px;
      margin:auto;
      padding:60px 0;
    }
    .number{
      color:#999;
      font-size:14px;
      letter-spacing:3px;
    }
    .title{
      font-size:42px;
      margin-top:10px;
    }
    .info{
      color:#888;
      margin-bottom:40px;
    }
    .story{
      font-size:18px;
      line-height:2.2;
      margin:40px 0;
    }
    .photo{
      width:100%;
      border-radius:12px;
      margin:40px 0;
    }
    .end{
      color:#777;
      text-align:center;
      margin-top:80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!--========================-->
    <!-- 编号（修改这里）-->
    <div class="number">
      No.039
    </div>
    <!--========================-->
    <!-- 标题（修改这里）-->
    <div class="title">
      彩虹步道|市政府
    </div>
    <!--========================-->
    <!-- 时间 / 地点（修改这里）-->
    <div class="info">
      
    </div>

      台北的彩虹步道，最出名当然是在西门町，游客来来往往，日夜不息：但如果要pride，市政府前的才是最有意义的。
      
    </div>
    <!--========================-->
    <!-- 第一张图片（修改这里）-->
    <img class="photo" src="../images/039-1.jpg">
    <!--========================-->
    <!-- 第二段正文（修改这里）-->
    <div class="story">
      每年的pride mouth，游行队伍从市政府前出发。彩虹骄傲地飘扬在这个城市，人们做人。
    </div>
    <!--========================-->
    <!-- 第二张图片（修改这里）-->
    <img class="photo" src="../images/039-2.jpg">
    <!--========================-->
    <!-- 第三段正文（修改这里）-->
    <div class="story">
      我们终究难舍难分，像水溶于水中。
    </div>
    <!--========================-->
    <!-- 第三张图片（需要就复制，不需要就删）-->

    <!--========================-->
    <!-- 第四段正文（需要就复制，不需要就删）-->

    </div>
    <!--========================-->
    <!-- 结尾（修改这里）-->

    </div>
  </div>

</html>
